############################################
# Production overlay
############################################
# Usage:
#   docker compose --env-file .env.docker \
#     -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Exposes only Nginx on port 80. The API stays on the internal network.
############################################

services:
  postgres:
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    ports: !reset []
    environment:
      NODE_ENV: production
      RUN_SEEDS: ${RUN_SEEDS:-false}
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    container_name: coffee-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${NGINX_PUBLISH_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - coffee-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/nginx-health || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M
