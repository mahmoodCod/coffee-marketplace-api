# ---------------------------------------------------------------------------
# Nginx reverse proxy for the Coffee Marketplace API (production compose)
# ---------------------------------------------------------------------------
# Terminates HTTP on :80 and forwards to the NestJS container.
# Add TLS termination / Let's Encrypt in front of this for real production.
# ---------------------------------------------------------------------------

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time';

  access_log /var/log/nginx/access.log main;

  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  server_tokens      off;

  # Upload / JSON body size (product images, etc. — adjust as needed)
  client_max_body_size 10m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    image/svg+xml;

  upstream coffee_api {
    server api:3000;
    keepalive 32;
  }

  # Rate-limit zone for auth endpoints (basic abuse protection)
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

  server {
    listen 80;
    server_name _;

    # Security headers (baseline)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Liveness for the proxy itself
    location = /nginx-health {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # Stricter limit on auth routes
    location ^~ /auth/ {
      limit_req zone=auth_limit burst=20 nodelay;

      proxy_pass         http://coffee_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_connect_timeout 10s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
    }

    location / {
      proxy_pass         http://coffee_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_connect_timeout 10s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
    }
  }
}
